<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AQI Alerts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>AQI Alerts & Health Advisory</h1>
    <p>Predict air quality from OpenAQ or manual inputs and see health risks.</p>
    <div class="backend-config" style="margin-top: 15px; font-size: 0.9rem;">
      <label for="backend-url" style="color: #aaa;">FastAPI Backend URL:</label>
      <input id="backend-url" style="background: #222; color: white; border: 1px solid #444; border-radius: 4px; padding: 5px 8px; width: 280px;" placeholder="https://aqi-backend-v5ay.onrender.com" />
      <button id="save-backend" style="background: #00B4D8; border: none; color: white; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px;">Connect</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Predict by Location (OpenAQ)</h2>
      <form id="openaq-form">
        <div class="row">
          <label for="city">City</label>
          <input id="city" placeholder="e.g., Delhi" required />
        </div>
        <div class="row">
          <label for="country">Country Code</label>
          <input id="country" placeholder="e.g., IN" value="IN" maxlength="2" />
        </div>
        <div class="row">
          <label for="lookback">Lookback Hours</label>
          <input id="lookback" type="number" min="1" max="48" value="6" />
        </div>
        <button type="submit">Fetch & Predict</button>
      </form>
      <div id="openaq-result" class="result"></div>
    </section>

    <section class="card">
      <h2>Predict from Manual Features</h2>
      <form id="manual-form">
        <div class="grid">
          <div class="row">
            <label for="si">si (≈ PM2.5)</label>
            <input id="si" type="number" step="0.01" value="0" />
          </div>
          <div class="row">
            <label for="ni">ni (≈ NO2)</label>
            <input id="ni" type="number" step="0.01" value="0" />
          </div>
          <div class="row">
            <label for="rpi">rpi (≈ PM10)</label>
            <input id="rpi" type="number" step="0.01" value="0" />
          </div>
        </div>
        <button type="submit">Predict</button>
      </form>
      <div id="manual-result" class="result"></div>
    </section>
  </main>

  <footer>
    <p>Connected to live backend at https://aqi-backend-v5ay.onrender.com</p>
  </footer>

  <script src="app.js"></script>
  
</body>
</html>
