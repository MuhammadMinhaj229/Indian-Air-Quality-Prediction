services:
  - type: web
    name: aqi-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8080

  - type: web
    name: aqi-frontend
    env: static
    buildCommand: ""
    staticPublishPath: "./frontend"
    envVars:
      - key: VITE_BACKEND_URL
        value: "https://aqi-backend.onrender.com"
